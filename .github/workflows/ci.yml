name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/sql/upgrade.sh reads an older schema.sql from history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify Chromium runtime (install missing system dependencies if needed)
        run: |
          if ! node tests/browser-runtime.cjs; then
            npx playwright install-deps chromium
            node tests/browser-runtime.cjs
          fi
      # What ships to students fails on any high or critical finding. Build tools (vite, the service-worker build) fail
      # only on critical: they run on this repository's own files at build time, and an advisory can cover every version
      # with no fix yet (picomatch, GHSA-fc5q-39xc-vjpf, Nov 2026). The full report is always printed.
      - name: Dependency audit (shipped code fails on high; build tools on critical)
        run: |
          npm audit || true
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Build, then run API, browser, sync and database checks
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: tests/shots
          if-no-files-found: ignore

  classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marker-slides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marker-slides/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
